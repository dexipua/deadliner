# Local development database: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deadliner
      POSTGRES_USER: deadliner
      POSTGRES_PASSWORD: deadliner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
