spring:
  application:
    name: deadliner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deadliner}
    username: ${DB_USER:deadliner}
    password: ${DB_PASSWORD:deadliner}
  task:
    scheduling:
      pool:
        # one thread per job: a slow Moodle sync must not delay reminders
        size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

deadliner:
  # 32 random bytes, base64; encrypts users' Moodle links at rest
  feed-key: ${DEADLINER_FEED_KEY}
  telegram:
    token: ${TELEGRAM_BOT_TOKEN}
