spring:
  application:
    name: deadliner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deadliner}
    username: ${DB_USER:deadliner}
    password: ${DB_PASSWORD:deadliner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
