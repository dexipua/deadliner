# Production: docker compose -f compose.prod.yaml up -d --build
# Needs a .env next to this file (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/deadliner
    # web dashboard; only reachable from the server itself, put a reverse proxy with HTTPS in front
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deadliner
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d deadliner"]
      interval: 5s
      retries: 10

  # Daily dump into ./backups, keeps the last 14 days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
        pg_dump -Fc deadliner > /backups/deadliner-$$(date +%F).dump &&
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
